<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 7.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 6.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 3.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.65;
      }
    </style>
  </defs>

  <!-- Teardrop Map Pin Silhouette Pointing Down (32, 54) -->
  <!-- Contrast Stroke -->
  <path class="contrast-stroke" d="M 32 54 
           C 20 41, 15 33, 15 25 
           C 15 15.5, 22.5 8, 32 8 
           C 41.5 8, 49 15.5, 49 25 
           C 49 33, 44 41, 32 54 Z" />

  <!-- Pale Lilac Outline -->
  <path class="outline-stroke" d="M 32 54 
           C 20 41, 15 33, 15 25 
           C 15 15.5, 22.5 8, 32 8 
           C 41.5 8, 49 15.5, 49 25 
           C 49 33, 44 41, 32 54 Z" />

  <!-- Filled Purple Accent Center Dot -->
  <circle class="contrast-fill" cx="32" cy="25" r="6.5" />
  <circle class="accent-fill" cx="32" cy="25" r="5" />

</svg>