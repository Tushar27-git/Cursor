<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 7.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Diagonal Pencil Outline with Solid Black Fill pointing to (9, 55) -->
  <path class="contrast-stroke" d="M 50 13 
           C 54 9, 58 13, 55 17 
           L 24 48 
           L 9 55 
           L 16 40 
           L 47 9 
           C 48 8, 49 8, 50 9 Z" />
  
  <path class="outline-stroke" d="M 50 13 
           C 54 9, 58 13, 55 17 
           L 24 48 
           L 9 55 
           L 16 40 
           L 47 9 
           C 48 8, 49 8, 50 9 Z" />

  <!-- Pencil Collar Line -->
  <line class="contrast-stroke-lean" x1="19.5" y1="43.5" x2="26.5" y2="50.5" />
  <line class="outline-stroke-lean" x1="19.5" y1="43.5" x2="26.5" y2="50.5" />

  <!-- Purple Filled Tip Lead -->
  <path class="accent-fill" d="M 9 55 L 16.5 44 L 23.5 51 Z" />

</svg>