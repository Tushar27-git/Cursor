<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 7.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Solid Black Person / User Silhouette (Head + Torso) -->
  <!-- Head -->
  <circle class="contrast-stroke" cx="32" cy="15.5" r="9.5" />
  <circle class="outline-stroke" cx="32" cy="15.5" r="9.5" />

  <!-- Torso Base -->
  <path class="contrast-stroke" d="M 11 54 C 11 41.5, 19.5 37.5, 32 37.5 C 44.5 37.5, 53 41.5, 53 54 Z" />
  <path class="outline-stroke" d="M 11 54 C 11 41.5, 19.5 37.5, 32 37.5 C 44.5 37.5, 53 41.5, 53 54 Z" />

  <!-- Purple Accent at Collar -->
  <rect class="accent-fill" x="28.8" y="36.5" width="6.4" height="2.6" rx="1.3" />

</svg>