<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 7.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 6.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 3.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.65;
      }
    </style>
  </defs>

  <!-- Diagonal Pencil Outline pointing bottom-left (12, 52) -->
  <!-- Contrast Stroke -->
  <path class="contrast-stroke" d="M 48 16 
           C 51 13, 54 16, 52 19 
           L 24 47 
           L 12 52 
           L 17 40 
           L 45 12 
           C 46 11, 47 11, 48 12 Z" />
  
  <!-- Pale Lilac Outline -->
  <path class="outline-stroke" d="M 48 16 
           C 51 13, 54 16, 52 19 
           L 24 47 
           L 12 52 
           L 17 40 
           L 45 12 
           C 46 11, 47 11, 48 12 Z" />

  <!-- Pencil Collar Line -->
  <line class="contrast-stroke-lean" x1="21" y1="44" x2="26" y2="49" />
  <line class="outline-stroke-lean" x1="21" y1="44" x2="26" y2="49" />

  <!-- Purple Filled Tip Lead at bottom-left point -->
  <path class="accent-fill" d="M 12 52 L 18 43 L 23 48 Z" />

</svg>