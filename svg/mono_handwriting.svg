<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 6.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Diagonal Pencil Outline with Solid Black Fill pointing to (10, 54) -->
  <path class="contrast-stroke" d="M 49 14 
           C 53 10, 57 14, 54 18 
           L 24 48 
           L 10 54 
           L 16 40 
           L 46 10 
           C 47 9, 48 9, 49 10 Z" />
  
  <path class="outline-stroke" d="M 49 14 
           C 53 10, 57 14, 54 18 
           L 24 48 
           L 10 54 
           L 16 40 
           L 46 10 
           C 47 9, 48 9, 49 10 Z" />

  <!-- Pencil Collar Line -->
  <line class="contrast-stroke-lean" x1="20" y1="44" x2="26" y2="50" />
  <line class="outline-stroke-lean" x1="20" y1="44" x2="26" y2="50" />

  <!-- Purple Filled Tip Lead -->
  <path class="accent-fill" d="M 10 54 L 17 44 L 23 50 Z" />

</svg>