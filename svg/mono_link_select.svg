<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 6.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Two Interlocking Rounded Chain Links with Solid Black Fill -->
  <!-- Upper Left Link -->
  <rect class="contrast-stroke" x="12" y="12" width="25" height="14" rx="7" ry="7" transform="rotate(-45 24.5 19)" />
  <!-- Lower Right Link -->
  <rect class="contrast-stroke" x="27" y="27" width="25" height="14" rx="7" ry="7" transform="rotate(-45 39.5 34)" />

  <rect class="outline-stroke" x="12" y="12" width="25" height="14" rx="7" ry="7" transform="rotate(-45 24.5 19)" />
  <rect class="outline-stroke" x="27" y="27" width="25" height="14" rx="7" ry="7" transform="rotate(-45 39.5 34)" />

  <!-- Purple Connection Accent Pill at Junction -->
  <circle cx="32" cy="32" r="5.5" fill="#000000" />
  <circle class="accent-fill" cx="32" cy="32" r="4" />

</svg>