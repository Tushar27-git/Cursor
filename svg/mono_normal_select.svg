<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 6.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Outer Dark Contrast Stroke + Solid Black Body -->
  <path class="contrast-stroke" d="M 11 6
           C 24 17, 43 28, 50 49
           C 51.2 52.5, 47 55.5, 43.5 52
           C 34.5 43.5, 27 36, 22.5 37.8
           C 17 39.5, 14.5 49, 13.5 53
           C 12 56.5, 10.5 55.5, 10.5 51
           Z" />

  <!-- Pale Lilac-White Outline with Solid Black Fill -->
  <path class="outline-stroke" d="M 11 6
           C 24 17, 43 28, 50 49
           C 51.2 52.5, 47 55.5, 43.5 52
           C 34.5 43.5, 27 36, 22.5 37.8
           C 17 39.5, 14.5 49, 13.5 53
           C 12 56.5, 10.5 55.5, 10.5 51
           Z" />

  <!-- Floating Purple Accent Pill in Heel -->
  <rect class="accent-fill" x="13.8" y="39" width="4.4" height="10.5" rx="2.2" />

</svg>