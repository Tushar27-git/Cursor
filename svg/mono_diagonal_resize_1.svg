<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 7.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 6.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 3.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.65;
      }
    </style>
  </defs>

  <!-- NW to SE Double-Headed Diagonal Arrow -->
  <!-- Contrast Stroke -->
  <path class="contrast-stroke" d="M 12 25 L 12 12 L 25 12" />
  <path class="contrast-stroke" d="M 12 12 L 52 52" />
  <path class="contrast-stroke" d="M 39 52 L 52 52 L 52 39" />

  <!-- Pale Lilac Outline -->
  <path class="outline-stroke" d="M 12 25 L 12 12 L 25 12" />
  <path class="outline-stroke" d="M 12 12 L 52 52" />
  <path class="outline-stroke" d="M 39 52 L 52 52 L 52 39" />

</svg>