<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 7.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Two Interlocking Rounded Chain Links (+7.5% Scale Enhancement) -->
  <!-- Upper Left Link -->
  <rect class="contrast-stroke" x="9" y="10.5" width="29" height="16" rx="8" ry="8" transform="rotate(-45 23.5 18.5)" />
  <!-- Lower Right Link -->
  <rect class="contrast-stroke" x="26" y="27.5" width="29" height="16" rx="8" ry="8" transform="rotate(-45 40.5 35.5)" />

  <rect class="outline-stroke" x="9" y="10.5" width="29" height="16" rx="8" ry="8" transform="rotate(-45 23.5 18.5)" />
  <rect class="outline-stroke" x="26" y="27.5" width="29" height="16" rx="8" ry="8" transform="rotate(-45 40.5 35.5)" />

  <!-- Purple Connection Accent Pill at Junction -->
  <circle cx="32" cy="32" r="6.2" fill="#000000" />
  <circle class="accent-fill" cx="32" cy="32" r="4.6" />

</svg>