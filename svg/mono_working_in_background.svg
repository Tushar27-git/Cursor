<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .contrast-stroke-hollow {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 8.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-hollow {
        stroke: #F5F1FF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.75;
        stroke-width: 7.0;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #000000;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.75;
      }
      .solid-black {
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Base Pointer Contrast + Solid Black -->
  <path class="contrast-stroke" d="M 10 5
           C 24 16, 44 28, 52 50
           C 53.2 53.8, 48.8 57, 45 53.5
           C 35.5 44.5, 27.5 36.5, 22.8 38.5
           C 17 40.5, 14 50.5, 13 54.8
           C 11.5 58.5, 9.5 57.5, 9.5 52.5
           Z" />

  <!-- Base Pointer Outline -->
  <path class="outline-stroke" d="M 10 5
           C 24 16, 44 28, 52 50
           C 53.2 53.8, 48.8 57, 45 53.5
           C 35.5 44.5, 27.5 36.5, 22.8 38.5
           C 17 40.5, 14 50.5, 13 54.8
           C 11.5 58.5, 9.5 57.5, 9.5 52.5
           Z" />

  <!-- Purple Pill in Heel -->
  <rect class="accent-fill" x="13.2" y="39.5" width="4.6" height="11" rx="2.3" />

  <!-- Spinner Ring at Lower Right -->
  <circle cx="52" cy="50" r="9.5" fill="#000000" />
  <circle cx="52" cy="50" r="8.4" stroke="#000000" stroke-width="6.2" fill="none" stroke-dasharray="29 15" />
  <circle cx="52" cy="50" r="8.4" stroke="#F5F1FF" stroke-width="3.6" fill="none" stroke-dasharray="29 15" stroke-linecap="round" />
  <!-- Purple Accent Dot -->
  <circle class="accent-fill" cx="58.2" cy="44.8" r="2.9" />

</svg>