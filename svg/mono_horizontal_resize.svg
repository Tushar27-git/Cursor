<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .contrast-stroke {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 7.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke {
        stroke: #F5F1FF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-stroke-lean {
        stroke: #000000;
        stroke-opacity: 0.65;
        stroke-width: 6.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .outline-stroke-lean {
        stroke: #F5F1FF;
        stroke-width: 3.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .accent-fill {
        fill: #B18CFF;
      }
      .accent-stroke {
        stroke: #B18CFF;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .contrast-fill {
        fill: #000000;
        fill-opacity: 0.65;
      }
    </style>
  </defs>

  <!-- Horizontal Double-Headed Arrow -->
  <!-- Contrast Stroke -->
  <path class="contrast-stroke" d="M 20 23 L 10 32 L 20 41" />
  <path class="contrast-stroke" d="M 10 32 L 54 32" />
  <path class="contrast-stroke" d="M 44 23 L 54 32 L 44 41" />

  <!-- Pale Lilac Outline -->
  <path class="outline-stroke" d="M 20 23 L 10 32 L 20 41" />
  <path class="outline-stroke" d="M 10 32 L 54 32" />
  <path class="outline-stroke" d="M 44 23 L 54 32 L 44 41" />

</svg>